name: Node.js REST API CI/CD

on:
  release:
    types: [created]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_release_version.outputs.version }}

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      DOCKER_HUB_REGISTRY: ${{ secrets.DOCKER_HUB_REGISTRY }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "14"

      - name: Install Dependencies
        run: npm install

      - name: Get Release Version
        id: get_release_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ env.DOCKER_HUB_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/nodejs-api:${{ steps.get_release_version.outputs.version }}" \
            .

      - name: Log in to Docker Hub
        run: |
          echo "${{ env.DOCKER_HUB_PASSWORD }}" \
            | docker login -u "${{ env.DOCKER_HUB_USERNAME }}" --password-stdin "${{ env.DOCKER_HUB_REGISTRY }}"

      - name: Push Docker Image
        run: |
          docker push "${{ env.DOCKER_HUB_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/nodejs-api:${{ steps.get_release_version.outputs.version }}"

      - name: Echo success
        run: |
          IMAGE_TAG=${{ steps.get_release_version.outputs.version }}
          echo "✅ Pushed image: ${{ env.DOCKER_HUB_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/nodejs-api:${IMAGE_TAG}"

      # ----------------------------------------
      # Prepare for Kubernetes deployment
      # ----------------------------------------
  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    env:
      CLUSTER_NAME: my-eks-cluster
      AWS_REGION: us-east-1
      RELEASE_VER: ${{ needs.build_and_push.outputs.version }}
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS creds & kubectl
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          curl -LO "https://dl.k8s.io/release/$(curl -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION

      - name: Apply Manifests
        run: |
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Zero-downtime rollout
        run: |
          IMAGE="${{ env.DOCKER_HUB_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/nodejs-api:${{ env.RELEASE_VER }}"
          kubectl set image deployment/nodejs-api nodejs-api="$IMAGE" --record
          kubectl rollout status deployment/nodejs-api --timeout=3m
