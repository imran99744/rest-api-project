version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rest-api-project:dev
    container_name: rest-api-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - OWM_API_KEY=${OWM_API_KEY}
      - VERSION=1.0.0
    volumes:
      - ./:/app
      - /app/node_modules
    restart: unless-stopped
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
