name: Node.js REST API CI/CD

on:
  release:
    types: [created]

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    env:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      DOCKER_HUB_REGISTRY: ${{ secrets.DOCKER_HUB_REGISTRY }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "14"

      - name: Install Dependencies
        run: npm install

      - name: Get Release Version
        id: get_release_version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ env.DOCKER_HUB_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/nodejs-api:${{ steps.get_release_version.outputs.version }}" \
            .

      - name: Log in to Docker Hub
        run: |
          echo "${{ env.DOCKER_HUB_PASSWORD }}" \
            | docker login -u "${{ env.DOCKER_HUB_USERNAME }}" --password-stdin "${{ env.DOCKER_HUB_REGISTRY }}"

      - name: Push Docker Image
        run: |
          docker push "${{ env.DOCKER_HUB_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/nodejs-api:${{ steps.get_release_version.outputs.version }}"

      - name: Echo success
        run: |
          IMAGE_TAG=${{ steps.get_release_version.outputs.version }}
          echo "✅ Pushed image: ${{ env.DOCKER_HUB_REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/nodejs-api:${IMAGE_TAG}"

