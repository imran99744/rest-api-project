version: '3.8'

services:
  app:
    build: .
    container_name: node-app-dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - OWM_API_KEY=${OWM_API_KEY}  # From .env file
      - VERSION=${VERSION:-1.0.0}
